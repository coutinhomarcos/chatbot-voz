<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot por Voz</title>

    <style>
        body {
            background-color: #0e0f0e;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="chatbox">
        <img src="gestacao.jpg" alt="gestação" width="400"
             style="display:block; margin:20px auto; border-radius:10px;">

        <h2>Chatbot por Voz</h2>
        <button onclick="ouvir()">Falar Agora</button>
        <div id="respostatexto"></div>
    </div>

    <script>
        const pergunta = [
            "producao",
            "prematuro",
            "nome",
            "armazenado",
            "colostro"
        ];

        const resposta = [
            "Prolactina",
            "Menos de 37 semanas",
            "Mastite",
            "Alvéolos",
            "Imunoglobulina"
        ];

        function falar(texto) {
            const discurso = new SpeechSynthesisUtterance(texto);
            discurso.lang = "pt-BR";
            discurso.rate = 1.2;
            window.speechSynthesis.speak(discurso);
            document.getElementById("respostatexto").innerText = texto;
        }

        function ouvir() {
            const reconhecer = new webkitSpeechRecognition();
            reconhecer.lang = "pt-BR";
            reconhecer.start();

            reconhecer.onresult = function(event) {
                const textoFalado = event.results[0][0].transcript.toLowerCase();

                for (let i = 0; i < pergunta.length; i++) {
                    if (textoFalado.includes(pergunta[i])) {
                        falar(resposta[i]);
                        return;
                    }
                }

                falar("Desculpe, eu não entendi.");
            };
        }
    </script>

</body>
</html>
